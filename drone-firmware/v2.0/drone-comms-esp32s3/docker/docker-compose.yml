services:
  esp32s3_vision:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - LC_ALL=C
    network_mode: "host"
    privileged: true          # required for /dev/ttyACM0 access
    tty: true
    volumes:
      - /dev:/dev
      # Shared components live two levels up (drone-vision/components/)
      - ../../components/esp32-camera:/code/components/esp32-camera
      - ../../components/psram_bss_scheme:/code/components/psram_bss_scheme
      # OpenCV pre-built for ESP32-S3 (Xtensa), shared from drone-firmware
      - /home/pihas/drone-swarm-challenge-2026/drone-firmware/components/espressif__opencv:/code/components/espressif__opencv:ro
      # Shared managed_components (esp_jpeg etc.) from drone-vision root
      - ../../managed_components:/code/managed_components
      # Project source files from this subfolder
      - ../main:/code/main
      - ../CMakeLists.txt:/code/CMakeLists.txt
      - ../sdkconfig.defaults:/code/sdkconfig.defaults
      # sdkconfig is NOT bind-mounted — idf.py set-target/rename fails on a
      # Docker bind-mount file (EBUSY). sdkconfig is generated inside the
      # container from sdkconfig.defaults and persists for the container lifetime.
      - ../partitions.csv:/code/partitions.csv
    # Keep container alive — use docker compose exec to run commands.
    # Typical workflow:
    #   docker compose exec esp32s3_vision idf.py build
    #   docker compose exec esp32s3_vision idf.py -p /dev/ttyACM0 flash monitor
    command: sleep infinity
