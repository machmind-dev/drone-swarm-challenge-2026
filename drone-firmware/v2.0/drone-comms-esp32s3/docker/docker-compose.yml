services:
  esp32s3_comms:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - LC_ALL=C
    network_mode: "host"
    privileged: true          # required for /dev/ttyACM0 access
    tty: true
    volumes:
      - /dev:/dev
      # micro-ROS component — large (358 MB), shared from v1.0 archive
      - /home/pihas/drone-swarm-challenge-2026/drone-firmware/v1.0/components/micro_ros_espidf_component:/code/components/micro_ros_espidf_component
      # Shared protocol header (p4_link_protocol.h)
      - ../../shared:/code/shared
      # Project source files from this subfolder
      - ../main:/code/main
      - ../CMakeLists.txt:/code/CMakeLists.txt
      - ../sdkconfig.defaults:/code/sdkconfig.defaults
      # sdkconfig is NOT bind-mounted — idf.py set-target/rename fails on a
      # Docker bind-mount file (EBUSY). sdkconfig is generated inside the
      # container from sdkconfig.defaults and persists for the container lifetime.
      - ../partitions.csv:/code/partitions.csv
    # Keep container alive — use docker compose exec to run commands.
    # Typical workflow:
    #   docker compose exec esp32s3_comms idf.py set-target esp32s3
    #   docker compose exec esp32s3_comms idf.py build
    #   docker compose exec esp32s3_comms idf.py -p /dev/ttyACM0 flash monitor
    command: sleep infinity
