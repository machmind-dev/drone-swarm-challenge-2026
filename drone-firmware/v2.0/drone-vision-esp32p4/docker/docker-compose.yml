services:
  esp32p4_vision:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - LC_ALL=C
    network_mode: "host"
    privileged: true          # required for /dev/ttyACM0 access
    tty: true
    volumes:
      - /dev:/dev
      # Local components (VL53L1-ULD-ESP and any future additions)
      - ../components:/code/components
      # Shared protocol header (p4_link_protocol.h)
      - ../../shared:/code/shared
      # Project source files from the ESP32P4 subfolder
      - ../main:/code/main
      - ../CMakeLists.txt:/code/CMakeLists.txt
      - ../sdkconfig.defaults:/code/sdkconfig.defaults
      - ../partitions.csv:/code/partitions.csv
      # sdkconfig and managed_components are NOT bind-mounted.
      # Both are written/deleted by idf.py at runtime; Docker bind-mount
      # directories/files become OS mount-points that idf.py cannot rename
      # or rmtree (EBUSY). They live in the container's writable layer —
      # managed_components are re-fetched on first build after a fresh start.
      #
      # WARNING — bind-mount stale-inode trap:
      # Docker file bind-mounts track inodes, not paths. If a file is replaced
      # on the host (e.g. by Write tool, cp, or git checkout), the container
      # still sees the OLD inode. Symptoms: container has outdated file content
      # even though the host shows the correct version.
      # Fix: push content into the container manually, then regenerate sdkconfig:
      #   cat sdkconfig.defaults | docker compose exec -T esp32p4_vision tee /code/sdkconfig.defaults
      #   docker compose exec esp32p4_vision rm -f /code/sdkconfig
      #   docker compose exec esp32p4_vision idf.py build
    # Keep container alive — use docker compose exec to run commands.
    #
    # BOARD USB NOTE: Waveshare ESP32-P4-WiFi6 uses a WCH CH343 USB-UART bridge
    # (1a86:55d3) on UART0 → /dev/ttyACM0.  CONFIG_ESP_CONSOLE_UART_CUSTOM=y
    # (sdkconfig.defaults) routes the IDF console there at 921600 baud.
    #
    # First-time setup (run once after container start):
    #   docker compose exec esp32p4_vision idf.py set-target esp32p4
    #
    # Build & flash:
    #   docker compose exec esp32p4_vision idf.py build
    #   docker compose exec esp32p4_vision idf.py -p /dev/ttyACM0 flash monitor
    command: sleep infinity
