version: "3.9"
services:
  esp32s3_vision:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - LC_ALL=C
    network_mode: "host"
    privileged: true          # required for /dev/ttyACM0 access
    tty: true
    volumes:
      - /dev:/dev
      - ../components/esp32-camera:/code/components/esp32-camera
      - ../components/psram_bss_scheme:/code/components/psram_bss_scheme
      - /home/pihas/drone-swarm-challenge-2026/drone-firmware/components/espressif__opencv:/code/components/espressif__opencv:ro
      - ../managed_components:/code/managed_components
      - ../main:/code/main
      - ../CMakeLists.txt:/code/CMakeLists.txt
      - ../sdkconfig.defaults:/code/sdkconfig.defaults
      - ../sdkconfig:/code/sdkconfig
      - ../partitions.csv:/code/partitions.csv
    # Keep container alive so `docker compose exec` can enter it at any time.
    # Run commands via: docker compose exec esp32s3_vision idf.py build
    command: sleep infinity
